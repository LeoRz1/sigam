{% extends "layout.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1"><i class="bi bi-droplet-half text-warning"></i> LubriGest</h1>
        <p class="text-body-secondary">Ingresa con tu correo y contraseña.</p>
        <form method="post">
          <div class="mb-3"><label class="form-label" for="email">Correo</label>
            <input class="form-control" id="email" name="email" type="email" required autofocus></div>
          <div class="mb-3"><label class="form-label" for="password">Contraseña</label>
            <input class="form-control" id="password" name="password" type="password" required></div>
          <button class="btn btn-primary w-100" type="submit">Entrar</button>
        </form>
        <hr>
        <p class="small mb-0 text-center">¿Eres cliente nuevo? <a href="{{ url_for('auth.registro') }}">Crea tu cuenta</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
