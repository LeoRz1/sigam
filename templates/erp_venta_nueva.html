{% extends "layout.html" %}
{% block title %}Nueva venta{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Nueva venta en mostrador</h1>
<form method="post" id="form-venta" data-iva="{{ config.IVA }}">
  <div class="row g-3 mb-3">
    <div class="col-md-6"><label class="form-label">Cliente (opcional)</label>
      <select class="form-select" name="cliente_id"><option value="">Consumidor final</option>
        {% for c in clientes %}<option value="{{ c.id }}">{{ c.nombre }}</option>{% endfor %}</select></div>
  </div>
  <div class="table-responsive"><table class="table align-middle" id="tabla-items">
    <thead><tr><th style="min-width:260px">Producto</th><th style="width:120px">Cantidad</th>
      <th class="text-end">Precio</th><th class="text-end">Subtotal</th><th></th></tr></thead>
    <tbody></tbody></table></div>
  <button type="button" class="btn btn-outline-primary btn-sm mb-3" id="agregar-fila"><i class="bi bi-plus-lg"></i> Agregar producto</button>
  <div class="row justify-content-end"><div class="col-md-5 col-lg-4">
    <table class="table table-sm">
      <tr><td>Subtotal</td><td class="text-end" id="t-subtotal">$0</td></tr>
      <tr><td>IVA ({{ (config.IVA * 100)|int }}%)</td><td class="text-end" id="t-iva">$0</td></tr>
      <tr class="fw-bold"><td>Total</td><td class="text-end" id="t-total">$0</td></tr></table>
  </div></div>
  <button class="btn btn-primary" type="submit"><i class="bi bi-check2"></i> Registrar venta</button>
  <a class="btn btn-outline-secondary" href="{{ url_for('erp.ventas') }}">Cancelar</a>
</form>

<template id="fila-tpl">
  <tr>
    <td><select class="form-select item-producto" name="producto_id" required>
      <option value="">Selecciona…</option>
      {% for p in productos %}<option value="{{ p.id }}" data-precio="{{ p.precio }}" data-stock="{{ p.stock_actual }}">{{ p.nombre }} · {{ p.presentacion }} (stock {{ p.stock_actual }})</option>{% endfor %}
    </select></td>
    <td><input class="form-control item-cant" type="number" name="cantidad" value="1" min="1" required></td>
    <td class="text-end item-precio">$0</td><td class="text-end item-subtotal">$0</td>
    <td><button type="button" class="btn btn-sm btn-outline-danger quitar-fila"><i class="bi bi-x-lg"></i></button></td>
  </tr>
</template>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/pos.js') }}"></script>{% endblock %}
